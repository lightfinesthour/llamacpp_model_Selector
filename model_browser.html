<main class="shell"><aside class="sidebar"><div class="search-top"><nav class="tabs"><button id="discover" class="active">Discover</button><button id="local">My Models</button></nav><div class="searchbox"><input id="query" aria-label="Search models" placeholder="Search models by name or author, or paste a Hugging Face URL…" autocomplete="off"><button id="clear" class="clear" aria-label="Clear search">×</button></div><div class="tools"><span id="count" class="tiny muted">Discover GGUF models</span><select id="sort" aria-label="Sort models"><option value="match">Best Match</option><option value="likes">Most Likes</option><option value="downloads" selected>Most Downloads</option><option value="recent">Recently Updated</option></select></div></div><div id="results" class="results" aria-live="polite"></div><footer class="sidefoot"><span class="tiny muted">◈ llama.cpp · Hugging Face</span><button id="close" class="ghost tiny">Return to launcher ↗</button></footer></aside><section id="detail" class="detail"><div class="empty"><div class="orb">◈</div><h2>Find your next model</h2><p>Search Hugging Face GGUF models.<br>Compare quantizations, choose companion files,<br>and download directly to your library.</p></div></section></main>
<aside id="progress" class="progress hidden" aria-live="polite"></aside><div id="toast" class="toast hidden" role="alert"></div><dialog id="confirm"><h2 id="confirm-title"></h2><div id="confirm-body"></div><div class="row" style="justify-content:flex-end;margin-top:20px"><button id="confirm-no">Cancel</button><button id="confirm-yes" class="primary">Confirm</button></div></dialog>
<script>
const $=id=>document.getElementById(id), token=location.hash.slice(1);let queryTimer,toastTimer,searchVersion=0,detailVersion=0,items=[],more=false,mode='discover',model=null,mainIndex=null,roots=[],memory={},busy=false,localModels=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{if(n==null)return 'Unknown size';let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?2:0)+' '+['B','KiB','MiB','GiB','TiB'][i]};
const num=n=>(n||0).toLocaleString();
function age(date){if(!date)return 'Update date unavailable';let d=Math.max(0,Math.floor((Date.now()-Date.parse(date))/86400000));return d===0?'Today':d===1?'1 day ago':d+' days ago'}
async function api(path,body){let r=await fetch('/api/'+path,{headers:{'X-Browser-Token':token,...(body?{'Content-Type':'application/json'}:{})},method:body?'POST':'GET',body:body?JSON.stringify(body):undefined});let data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),8500)}
function confirmation(title,body,label='Download',danger=false){return new Promise(resolve=>{$('confirm-title').textContent=title;$('confirm-body').innerHTML=body;$('confirm-yes').textContent=label;$('confirm-yes').className=danger?'danger':'primary';const end=v=>{$('confirm').close();resolve(v)};$('confirm-no').onclick=()=>end(false);$('confirm-yes').onclick=()=>end(true);$('confirm').oncancel=e=>{e.preventDefault();end(false)};$('confirm').showModal()})}
function resultHTML(m){let parts=m.id.split('/');return `<div class="row"><span class="icon">◈</span><span class="name grow">${esc(parts.slice(1).join('/')||parts[0])}</span><span class="metrics"><span class="metric">♡ ${num(m.likes)}</span><span class="metric">↓ ${num(m.downloads)}</span></span></div><div class="row between sub"><span>${esc(parts[0])}</span><span>${age(m.updated)}</span></div>`}
function renderResults(){let host=$('results');host.replaceChildren();for(const m of items){let b=document.createElement('button');b.className='result'+(model?.id===m.id?' selected':'');b.innerHTML=resultHTML(m);b.onclick=()=>openModel(m.id);host.append(b)}if(!items.length)host.innerHTML='<div class="message">No models found. Try a shorter name or an exact owner/repository.</div>';if(more){let b=document.createElement('button');b.className='ghost';b.style.width='100%';b.textContent='Show more models';b.onclick=()=>search(true);host.append(b)}}
async function search(append=false){if(mode==='local')return renderLocal();let version=++searchVersion,q=$('query').value.trim();if(!append){items=[];$('results').innerHTML='<div class="message">Searching Hugging Face…</div>'}$('count').textContent='Searching…';try{let data=await api('search?'+new URLSearchParams({q,sort:$('sort').value,offset:append?items.length:0}));if(version!==searchVersion||mode!=='discover')return;items=append?items.concat(data.items):data.items;more=data.more;$('count').textContent=items.length+(more?'+':'')+' models';renderResults();if(!append&&items.length)openModel(items[0].id)}catch(e){if(version!==searchVersion)return;$('count').textContent='Search failed';$('results').innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
function options(kind){return model.variants.map((v,i)=>({v,i})).filter(x=>x.v.kind===kind&&x.i!==mainIndex&&x.v.complete)}
function companionHTML(kind,label){let list=options(kind);return `<div class="field"><label for="${kind}">${label}</label><select id="${kind}"><option value="">None${kind==='draft'?' / embedded MTP':''}</option>${list.map(({v,i})=>`<option value="${i}">${esc(v.name)} · ${bytes(v.size)}</option>`).join('')}</select></div>`}
function fit(size){if(size==null)return '';if(memory.vram&&size<memory.vram*.9)return '<span class="chip" style="background:#17653c;color:#aef8c4">Weights fit GPU</span>';if(memory.ram&&size<memory.ram*.85)return '<span class="chip" style="background:#284b6c">Weights fit RAM</span>';if(memory.ram)return '<span class="chip" style="background:#873139">Likely too large</span>';return ''}
function chosenHTML(v){return `<span class="chip format">GGUF</span><span class="chosen-name">${esc(v.name.replace(/\.gguf$/i,''))}</span><span class="chip quant">${esc(v.quant)}</span><span class="size">${bytes(v.size)}</span><span class="muted">⌄</span>`}
function quantOptions(){return ['model','vision','draft'].map(kind=>{let list=model.variants.map((v,i)=>({v,i})).filter(x=>x.v.kind===kind);return list.length?`<div class="option-heading">${kind==='model'?'Model quantizations':kind==='vision'?'Vision projectors':'MTP / draft modules'}</div>`+list.map(({v,i})=>`<button class="option ${i===mainIndex?'selected':''}" data-index="${i}" ${v.complete?'':'disabled'}><span>${i===mainIndex?'✓':'·'}</span><span class="chip format">GGUF</span><span class="name" title="${esc(v.name)}">${esc(v.name.replace(/\.gguf$/i,''))}</span><span class="chip quant">${esc(v.quant)}</span>${fit(v.size)}<span class="size">${bytes(v.size)}${v.files.length>1?' · '+v.files.length+' shards':''}${v.complete?'':' · Incomplete'}</span></button>`).join(''):''}).join('')}
async function openModel(repo){const version=++detailVersion;model={id:repo};renderResults();$('detail').innerHTML=`<div class="detail-head"><h1>◈ ${esc(repo)}</h1></div><div class="message">Loading model details and quantization sizes…</div>`;try{let data=await api('model?'+new URLSearchParams({repo}));if(version!==detailVersion||mode!=='discover')return;model=data;mainIndex=model.variants.findIndex(v=>v.kind==='model'&&v.complete&&v.quant==='Q4_K_M');if(mainIndex<0)mainIndex=model.variants.findIndex(v=>v.kind==='model'&&v.complete);if(mainIndex<0)mainIndex=model.variants.findIndex(v=>v.complete);renderDetail();let card=await api('readme?'+new URLSearchParams({repo,revision:data.revision}));if(version===detailVersion&&$('readme'))$('readme').innerHTML=card.html||markdown(card.text)}catch(e){if(version===detailVersion)$('detail').innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
function renderDetail(){let v=model.variants[mainIndex],vision=model.variants.some(v=>v.kind==='vision'),draft=model.variants.some(v=>v.kind==='draft');$('detail').innerHTML=`<header class="detail-head row"><span class="icon">◈</span><h1 class="grow">${esc(model.id)}</h1><button id="copy" class="ghost" aria-label="Copy repository">⧉</button></header><div class="meta"><span class="chip">↓ <b>${num(model.downloads)}</b></span><span class="chip">☆ <b>${num(model.likes)}</b></span><span class="tiny muted">Last updated: <b>${age(model.updated)}</b></span><a class="cardlink" href="https://huggingface.co/${encodeURI(model.id)}" target="_blank" rel="noreferrer"><button>🤗 Model Card ↗</button></a></div><div class="capabilities"><span class="tiny muted">Format</span><span class="chip format">GGUF</span>${vision?'<span class="chip vision">◉ Vision projector available</span>':''}${draft?'<span class="chip draft">MTP / draft files available</span>':''}</div><section class="panel"><div class="panel-title">⬡ Download Options</div><div class="panel-body">${v?`<details id="picker" class="download-picker"><summary id="chosen">${chosenHTML(v)}</summary><div id="options" class="options">${quantOptions()}</div></details><div id="companions" class="companions">${companionHTML('vision','Vision projector')}${companionHTML('draft','MTP / draft module')}</div><div class="destination field"><label for="root">Download location · owner / repository folders created automatically</label><select id="root">${roots.map((r,i)=>`<option value="${i}">${esc(r.path)}${r.free!=null?' · '+bytes(r.free)+' free':' · create folder'}</option>`).join('')}</select></div><div class="actions"><span id="plan-note" class="note"></span><button id="download" class="primary">↓ Download</button></div><div class="note" style="margin-top:9px">Memory badges estimate weights only; context and runtime need extra memory. Choose compatible companions; embedded MTP needs no separate file.</div>`:'<div class="message">No complete GGUF variants in this repository.</div>'}</div></section><section class="panel"><div class="panel-title">♧ README</div><article id="readme" class="readme"><p class="muted">Loading model card…</p></article></section>`;$('copy').onclick=()=>navigator.clipboard.writeText(model.id).catch(()=>notify(model.id));if(v){wireOptions();$('vision').onchange=$('draft').onchange=$('root').onchange=updatePlan;$('download').onclick=download;updatePlan()}}
function wireOptions(){for(let b of $('options').querySelectorAll('button'))b.onclick=()=>{let oldVision=$('vision').value,oldDraft=$('draft').value;mainIndex=Number(b.dataset.index);$('chosen').innerHTML=chosenHTML(model.variants[mainIndex]);$('options').innerHTML=quantOptions();$('picker').open=false;$('companions').innerHTML=companionHTML('vision','Vision projector')+companionHTML('draft','MTP / draft module');if([...$('vision').options].some(o=>o.value===oldVision))$('vision').value=oldVision;if([...$('draft').options].some(o=>o.value===oldDraft))$('draft').value=oldDraft;$('vision').onchange=$('draft').onchange=updatePlan;wireOptions();updatePlan()}}
function plan(){let indices=[mainIndex];for(let k of ['vision','draft'])if($(k).value!=='')indices.push(Number($(k).value));let variants=[...new Set(indices)].map(i=>model.variants[i]);return {variants,total:variants.every(v=>v.size!=null)?variants.reduce((n,v)=>n+v.size,0):null}}
function updatePlan(){let p=plan(),count=p.variants.reduce((n,v)=>n+v.files.length,0);$('plan-note').innerHTML=fit(p.total)+' '+count+' file'+(count===1?'':'s')+' · '+bytes(p.total);$('download').textContent='↓ Download   '+bytes(p.total);$('download').disabled=busy||!roots.length}
async function download(){let p=plan(),root=roots[Number($('root').value)],body={repo:model.id,revision:model.revision,main:mainIndex,vision:$('vision').value===''?null:Number($('vision').value),draft:$('draft').value===''?null:Number($('draft').value),root:Number($('root').value)};let destination=root.path+'\\'+model.id.replaceAll('/','\\');if(!await confirmation('Download '+bytes(p.total)+'?',`<p class="muted">${esc(destination)}</p><pre>${p.variants.flatMap(v=>v.files).map(esc).join('\n')}</pre><p class="note">hf downloads all selected shards. Chosen companion paths will be saved in model settings.</p>`))return;try{await api('download',body);busy=true;updatePlan();pollJob()}catch(e){notify(e.message)}}
function markdown(text){text=text.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');let inCode=false;const inline=s=>esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');let html=text.split('\n').map(line=>{if(line.startsWith('```')){inCode=!inCode;return inCode?'<pre>':'</pre>'}if(inCode)return esc(line)+'\n';let h=line.match(/^(#{1,3})\s+(.+)/);if(h)return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;if(/^\s*[-*]\s+/.test(line))return '<div class="bullet">• '+inline(line.replace(/^\s*[-*]\s+/,''))+'</div>';if(!line.trim())return '';return '<p>'+inline(line)+'</p>'}).join('');return html+(inCode?'</pre>':'')}
async function switchMode(next){mode=next;searchVersion++;detailVersion++;$('discover').classList.toggle('active',next==='discover');$('local').classList.toggle('active',next==='local');$('sort').classList.toggle('hidden',next==='local');$('query').placeholder=next==='local'?'Filter downloaded models…':'Search models by name or author, or paste a Hugging Face URL…';$('query').value='';if(next==='discover'){search()}else{model=null;$('detail').innerHTML='<div class="empty"><div class="orb">▣</div><h2>Your model library</h2><p>Select a model to see its files or delete it.</p></div>';await loadLibrary()}}
async function loadLibrary(){try{let data=await api('library');localModels=data.models;if(mode==='local')renderLocal()}catch(e){notify(e.message)}}
function renderLocal(){let q=$('query').value.toLowerCase(),list=localModels.filter(m=>m.path.toLowerCase().includes(q));$('count').textContent=list.length+' downloaded models';$('results').replaceChildren();for(let m of list){let b=document.createElement('button');b.className='result';b.innerHTML=`<div class="row"><span class="icon">▣</span><span class="name grow">${esc(m.name)}</span><span class="size">${bytes(m.size)}</span></div><div class="sub">${esc(m.path)}</div>`;b.onclick=()=>openLocal(m);$('results').append(b)}if(!list.length)$('results').innerHTML='<div class="message">No downloaded models found. Open Discover to get started.</div>'}
async function openLocal(m){let version=++detailVersion;try{let preview=await api('delete',{path:m.path});if(version!==detailVersion||mode!=='local')return;$('detail').innerHTML=`<header class="detail-head"><h1>▣ ${esc(m.name)}</h1></header><div class="meta"><span class="chip format">GGUF</span><span class="chip">${bytes(preview.size)}</span></div><section class="panel"><div class="panel-title">Model files</div><div class="panel-body"><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${preview.files.map(esc).join('\n')}</pre><p class="note">Vision and draft companions are kept because other quants may share them.</p><button id="delete-model" class="danger">Delete model…</button></div></section>`;$('delete-model').onclick=async()=>{if(!await confirmation('Permanently delete '+bytes(preview.size)+'?',`<pre>${preview.files.map(esc).join('\n')}</pre><p>These files and the model’s saved settings will be removed.</p>`,'Delete model',true))return;try{await api('delete',{path:m.path,confirm:true});$('detail').innerHTML='<div class="empty"><h2>Model deleted</h2></div>';loadLibrary()}catch(e){notify(e.message)}}}catch(e){notify(e.message)}}
function timeLeft(seconds){if(seconds==null||!Number.isFinite(seconds))return 'Calculating…';seconds=Math.ceil(seconds);if(seconds<60)return seconds+' sec';let minutes=Math.ceil(seconds/60);if(minutes<60)return minutes+' min';return Math.floor(minutes/60)+' hr '+minutes%60+' min'}
function transferHTML(j){let known=j.total_bytes!=null&&j.total_bytes>0;return `<div class="transfer-stats"><div><span>Download speed</span><strong>${j.speed_mbps==null?'Waiting…':j.speed_mbps.toFixed(2)+' MB/s'}</strong></div><div><span>Estimated time remaining</span><strong>${timeLeft(j.eta_seconds)}</strong></div></div><progress ${known?`value="${j.downloaded_bytes||0}" max="${j.total_bytes}"`:''}></progress><div class="transfer-bytes">${bytes(j.downloaded_bytes||0)}${known?' / '+bytes(j.total_bytes)+' · '+Math.min(100,100*(j.downloaded_bytes||0)/j.total_bytes).toFixed(1)+'%':''}${j.count?' · File '+Math.min(j.count,(j.completed||0)+1)+' of '+j.count:''}</div>`}
async function pollJob(){try{let j=await api('job');busy=j.status==='running';if($('download'))$('download').disabled=busy;if(j.status==='idle')return;let panel=$('progress'),logOpen=panel.querySelector('details')?.open;panel.classList.remove('hidden');panel.innerHTML=`<div class="row between"><h3>${busy?'↓ Downloading':j.status==='complete'?'✓ Download complete':j.status==='cancelled'?'Download cancelled':'Download failed'} · ${esc(j.repo)}</h3><button id="job-action" class="ghost">${busy?'Cancel':'×'}</button></div><p class="note">${esc(j.message||j.file||'Preparing…')}</p>${busy?transferHTML(j):''}<details ${logOpen?'open':''}><summary style="background:none;border:0;padding:5px 0;font-size:11px">Download log ⌄</summary><pre>${esc(j.log)}</pre></details>`;$('job-action').onclick=busy?()=>api('cancel',{}).catch(e=>notify(e.message)):()=>panel.classList.add('hidden')}catch(e){if(busy)notify('Lost connection to download service. Check the launcher terminal.')}}
$('query').oninput=()=>{clearTimeout(queryTimer);queryTimer=setTimeout(()=>search(),400)};$('query').onkeydown=e=>{if(e.key==='Enter'){clearTimeout(queryTimer);search()}};$('sort').onchange=()=>search();$('clear').onclick=()=>{$('query').value='';search();$('query').focus()};$('discover').onclick=()=>switchMode('discover');$('local').onclick=()=>switchMode('local');$('close').onclick=async()=>{try{await api('close',{});document.body.innerHTML='<div class="empty"><h2>Returned to the launcher</h2><p>You can close this window.</p></div>';window.close()}catch(e){notify(e.message)}};document.addEventListener('click',e=>{if($('picker')&&!$('picker').contains(e.target))$('picker').open=false});window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='A download is running.'}});
api('config').then(c=>{roots=c.roots;memory=c.memory||{};search();pollJob();$('query').focus()}).catch(e=>notify(e.message));setInterval(()=>{if(busy)pollJob()},1000);
</script></body></html>
